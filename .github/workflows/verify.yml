name: Verify action bundle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: warp-ubuntu-2404-x64-4x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - run: node --test tests/*.test.mjs
      - name: Run packaged action
        id: action
        uses: ./
        with:
          data: '{"environment":"stage"}'
      - name: Verify workflow output
        env:
          ENVIRONMENT: ${{ steps.action.outputs.data_environment }}
        run: test "$ENVIRONMENT" = "stage"
