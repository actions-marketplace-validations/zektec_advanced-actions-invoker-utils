name: Verify action bundle
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubicloud-standard-4-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Node.js version
        id: resolve-node-1
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_PROJECT_DIR: "."
          NODE_VERSION: ${{ vars.NODE_VERSION }}
        run: |
          version=""
          directory="$GITHUB_WORKSPACE/${NODE_PROJECT_DIR#./}"
          while [[ "$directory" == "$GITHUB_WORKSPACE"* ]]; do
            if [ -f "$directory/.tool-versions" ]; then
              version="$(awk '$1 == "nodejs" { print $2; exit }' "$directory/.tool-versions")"
              break
            fi
            [ "$directory" != "$GITHUB_WORKSPACE" ] || break
            directory="$(dirname "$directory")"
          done
          version="${version:-${NODE_VERSION:-}}"
          if [ -z "$version" ]; then
            echo "Define nodejs in .tool-versions or the NODE_VERSION organization variable" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.resolve-node-1.outputs.version }}
      - run: node --test tests/*.test.mjs
      - name: Run packaged action
        id: action
        uses: ./
        with:
          data: '{"environment":"stage"}'
      - name: Verify workflow output
        env:
          ENVIRONMENT: ${{ steps.action.outputs.data_environment }}
        run: test "$ENVIRONMENT" = "stage"
